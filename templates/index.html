<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>犬猫識別アプリ</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        form {
            margin: 30px 0;
        }

        input[type="file"] {
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        img {
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .result {
            margin-top: 20px;
            font-size: 24px;
            color: #2196F3;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🐶 犬猫識別アプリ 🐱</h1>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" required>
        <br>
        <button type="submit">判定する</button>
    </form>

    {% if image_path %}
        <h2>アップロード画像</h2>
        <img src="{{ image_path }}" width="300">
    {% endif %}

    {% if result %}
        <div class="result">
            判定結果: {{ result }}
        </div>
    {% endif %}
</body>
</html>
